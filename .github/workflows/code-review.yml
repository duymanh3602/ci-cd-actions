name: Big Pickle Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install OpenCode & AI DevOps
        run: npm install -g opencode-ai

      - name: Run Big Pickle Review
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          git diff origin/${{ github.base_ref }}...HEAD > pr_diff.txt
          
          opencode run --model opencode/big-pickle \
            "Perform a deep reasoning review. 
             1. Analyze the logic flow of the diff.
             2. Identify edge cases or potential side effects.
             3. Provide final recommendations based on your reasoning.
             
             Diff to review:
             $(cat pr_diff.txt)" > review_feedback.md

      - name: Post Comment to PR
        uses: thollander/actions-comment-pull-request@v2
        with:
          filePath: review_feedback.md